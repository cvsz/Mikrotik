name: Bug report
description: Report a reproducible zOS repository, controller, CI, or RouterOS automation defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private keys, runner credentials, or sensitive production exports."
  - type: input
    id: sha
    attributes:
      label: Commit or release
      placeholder: "git rev-parse HEAD / zos-v..."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Repository/validation
        - CORE/controller
        - RouterOS
        - GitHub Actions
        - Self-hosted runner
        - GHCR/package
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact sanitized commands/steps and exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Live impact / recovery state
      description: State whether a live system was changed and whether recovery/rollback is complete.
