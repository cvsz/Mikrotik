name: build-zos

on:
  push:
    branches: [main]
    tags: ['zos-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync

      - name: Validate stack
        run: |
          chmod +x tools/*.sh zOS/bin/zos zOS/install.sh
          ./tools/validate-repo.sh
          ./zOS/bin/zos help

      - name: Build zOS tarball
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < zOS/VERSION)"
          STAGE="dist/zos-mikrotik-${VERSION}"
          mkdir -p "$STAGE"
          rsync -a --exclude '.git' --exclude 'dist' ./ "$STAGE/"
          tar -C dist -czf "dist/zos-mikrotik-${VERSION}.tar.gz" "zos-mikrotik-${VERSION}"
          sha256sum "dist/zos-mikrotik-${VERSION}.tar.gz" > "dist/zos-mikrotik-${VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: zos-mikrotik-build
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mikrotik-zos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build zOS OCI package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zOS/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
