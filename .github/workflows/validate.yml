name: validate-routeros-stack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync
      - name: Make tools executable
        run: chmod +x tools/*.sh zOS/bin/zos zOS/install.sh
      - name: Static safety validation
        run: ./tools/validate-repo.sh
      - name: zOS CLI smoke test
        run: ./zOS/bin/zos help
      - name: Block secrets and private keys
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' --exclude='*.example' '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|private-key[=:][[:space:]]*[^$<]|password[=:][[:space:]]*[^$<{])' .; then
            echo 'Potential embedded secret/private key found.' >&2
            exit 1
          fi
